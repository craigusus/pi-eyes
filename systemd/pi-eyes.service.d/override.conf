# Runs the style supervisor as the X client in place of eyes.py. The supervisor
# restarts eyes.py on a style change, so X and fbx2 stay up throughout.
[Service]
EnvironmentFile=/etc/pi-eyes/env
ExecStart=
ExecStart=/bin/bash -c 'exec xinit ${PYTHON} /opt/pi-eyes-control/supervisor/eyes_supervisor.py --eyes ${PI_EYES_DIR}/eyes.py --radius ${RADIUS} -- :0'
